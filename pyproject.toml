[project]
name = "chs-tile-proxy"
version = "0.2.0"
description = "Caching XYZ tile proxy for the Canadian Hydrographic Service ENC MapServer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "pillow>=10.4",
]

[project.scripts]
chs-mkmap = "chs_mkmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chs_proxy", "src/chs_mkmap"]
