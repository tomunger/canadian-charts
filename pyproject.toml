[project]
name = "chs-tile-proxy"
version = "0.1.0"
description = "Caching XYZ tile proxy for the Canadian Hydrographic Service ENC MapServer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chs_proxy"]
